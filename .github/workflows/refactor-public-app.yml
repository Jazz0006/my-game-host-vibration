name: Refactor public app

on:
  push:
    branches:
      - codex/frontend-file-size-guard
    paths:
      - .github/workflows/refactor-public-app.yml
      - scripts/refactor-public-app.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/frontend-file-size-guard

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Split public app
        run: node scripts/refactor-public-app.mjs

      - name: Verify file sizes
        run: npm run check:file-sizes

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/appCore.js public/appRoom.js public/index.html public/app.js
          git commit -m "refactor: split public app below size limit"
          git push origin HEAD:codex/frontend-file-size-guard
