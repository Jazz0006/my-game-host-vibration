<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>对局实验室 · 无法官狼人杀助手</title>
  <link rel="stylesheet" href="/dev/assets/lab.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">开发工具</p>
      <h1>对局实验室</h1>
    </div>
    <a href="/" class="back-link">返回玩家端</a>
  </header>

  <main>
    <section class="toolbar" aria-label="添加虚拟玩家">
      <label for="room-input">房间号</label>
      <input id="room-input" class="room-input" inputmode="numeric" maxlength="4" autocomplete="off">
      <button id="add-player" class="primary">添加虚拟玩家</button>
      <span class="server-name-hint">玩家名字由服务器自动分配</span>
      <div class="room-summary">
        <span>当前房间</span>
        <strong id="room-id">未选择</strong>
      </div>
    </section>

    <section class="summary compact-summary" aria-label="虚拟玩家摘要">
      <div><span>已添加</span><strong id="client-count">0</strong></div>
      <div><span>在线</span><strong id="online-count">0</strong></div>
    </section>

    <section class="toolbar" aria-label="身份恢复测试">
      <label for="recovery-test-room">C4.3 身份恢复</label>
      <input id="recovery-test-room" class="room-input" inputmode="numeric" maxlength="4" placeholder="4位房间号" autocomplete="off">
      <input id="recovery-test-code" autocomplete="off" placeholder="房主生成的恢复码">
      <button id="recovery-test-claim" class="primary">用新虚拟客户端接管</button>
      <button id="recovery-test-disconnect" class="compact" disabled>断开恢复后的客户端</button>
      <span id="recovery-test-status" class="server-name-hint">先让目标玩家离线，再在房主端生成恢复码。</span>
    </section>

    <div id="notice" class="notice" role="status">先在玩家端创建房间，再输入房间号添加虚拟玩家。</div>

    <section class="workspace">
      <div class="players-area">
        <div class="section-heading">
          <h2>虚拟玩家</h2>
          <div class="section-tools">
            <button id="confirm-all-roles" class="compact" disabled>全部确认身份</button>
            <span id="run-state">等待添加</span>
          </div>
        </div>
        <div id="players" class="player-grid">
          <div class="empty-state">尚无虚拟玩家</div>
        </div>
      </div>

      <aside class="event-area">
        <div class="section-heading">
          <h2>加入日志</h2>
          <button id="clear-log" class="compact">清空日志</button>
        </div>
        <ol id="event-log" class="event-log" aria-live="polite"></ol>
      </aside>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/dev/assets/labBootstrap.js"></script>
  <script type="module" src="/dev/assets/recoveryLab.js"></script>
</body>
</html>
