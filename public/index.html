<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>无法官狼人杀助手</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 560px; margin: 0 auto; padding: 24px 16px; font-family: system-ui, sans-serif; background: #111318; color: #f5f5f5; }
    h1 { margin: 0 0 20px; font-size: 28px; text-align: center; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 19px; letter-spacing: 0; }
    .panel { margin-bottom: 14px; padding: 16px; border: 1px solid #373b45; border-radius: 8px; background: #1b1e25; }
    label { display: block; margin: 12px 0 6px; color: #c8cad0; }
    input, select, button { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 6px; font: inherit; }
    input, select { border: 1px solid #4b505c; background: #101218; color: #fff; }
    button { margin-top: 12px; border: 0; background: #efc75e; color: #17140b; font-weight: 750; cursor: pointer; }
    button.secondary { background: #4d586b; color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .hidden { display: none !important; }
    .room-id { margin: 4px 0 16px; font-size: 36px; font-weight: 800; color: #efc75e; }
    .player { display: flex; align-items: center; gap: 10px; min-height: 42px; border-bottom: 1px solid #30343d; }
    .player:last-child { border-bottom: 0; }
    .seat { width: 28px; color: #efc75e; font-weight: 700; }
    .status { margin-top: 12px; padding: 10px; border-left: 3px solid #efc75e; background: #12151b; line-height: 1.5; }
    .muted { color: #aeb2bc; font-size: 14px; }
    .error { color: #ff8d8d; min-height: 22px; }
    .overlay { position: fixed; inset: 0; z-index: 10; display: grid; align-content: center; padding: 24px; background: #111318; }
    .overlay-inner { width: min(100%, 480px); margin: auto; text-align: center; }
    .overlay h2 { font-size: 28px; }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice-grid button { min-height: 64px; }
  </style>
</head>
<body>
  <h1>无法官狼人杀助手</h1>

  <main id="entry">
    <section class="panel">
      <h2>创建房间</h2>
      <label for="host-name">房主名字</label>
      <input id="host-name" maxlength="20" value="房主">
      <button id="create-room">创建房间</button>
    </section>
    <section class="panel">
      <h2>加入房间</h2>
      <label for="room-input">房间号</label>
      <input id="room-input" inputmode="numeric" maxlength="6">
      <label for="player-name">玩家名字</label>
      <input id="player-name" maxlength="20">
      <button id="join-room">加入房间</button>
    </section>
    <p id="entry-error" class="error"></p>
  </main>

  <main id="room" class="hidden">
    <section class="panel">
      <div class="muted">房间号</div>
      <div id="room-id" class="room-id"></div>
      <div id="players"></div>
    </section>

    <section id="host-controls" class="panel hidden">
      <h2>震动闭环测试</h2>
      <label for="target-player">选择接收提醒的玩家</label>
      <select id="target-player"></select>
      <button id="send-prompt">发送测试提醒</button>
      <div id="prompt-status" class="status">尚未发送提醒</div>
    </section>

    <section class="panel">
      <button id="vibration-test" class="secondary">测试本机震动</button>
      <p class="muted">夜间请手持手机，并保持此页面在前台。</p>
    </section>
    <p id="room-error" class="error"></p>
  </main>

  <section id="prompt-overlay" class="overlay hidden">
    <div class="overlay-inner">
      <div id="prompt-received">
        <h2>轮到你行动</h2>
        <p>请先确认已经感受到震动。</p>
        <button id="ack-prompt">我已收到</button>
      </div>
      <div id="prompt-choice" class="hidden">
        <h2>请选择</h2>
        <div class="choice-grid">
          <button data-choice="选项一">选项一</button>
          <button data-choice="选项二">选项二</button>
        </div>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentRoomId = "";
    let currentPlayerId = "";
    let isHost = false;
    let activePromptId = "";

    const $ = id => document.getElementById(id);
    const setError = message => { $("room-error").textContent = message || ""; };

    function vibrate() {
      if (!("vibrate" in navigator)) return false;
      return navigator.vibrate([220, 120, 220]);
    }

    function enterRoom(result) {
      currentRoomId = result.roomId;
      currentPlayerId = result.playerId;
      $("entry").classList.add("hidden");
      $("room").classList.remove("hidden");
      $("room-id").textContent = currentRoomId;
    }

    function emitWithAck(event, data, onSuccess) {
      socket.emit(event, data, result => {
        if (!result?.ok) return setError(result?.message || "操作失败，请重试");
        setError("");
        onSuccess?.(result);
      });
    }

    $("create-room").addEventListener("click", () => {
      socket.emit("host:create-room", { name: $("host-name").value }, result => {
        if (!result?.ok) return $("entry-error").textContent = result?.message || "创建失败";
        enterRoom(result);
      });
    });

    $("join-room").addEventListener("click", () => {
      socket.emit("player:join-room", { roomId: $("room-input").value, name: $("player-name").value }, result => {
        if (!result?.ok) return $("entry-error").textContent = result?.message || "加入失败";
        enterRoom(result);
      });
    });

    socket.on("room:state", state => {
      if (state.roomId !== currentRoomId) return;
      isHost = state.viewer.playerId === currentPlayerId && state.viewer.isHost;
      $("host-controls").classList.toggle("hidden", !isHost);
      $("players").replaceChildren(...state.players.map(player => {
        const row = document.createElement("div");
        row.className = "player";
        const seat = document.createElement("span");
        seat.className = "seat";
        seat.textContent = player.seat;
        const name = document.createElement("span");
        name.textContent = `${player.name}${player.isHost ? "（房主）" : ""}${player.connected ? "" : "（离线）"}`;
        row.append(seat, name);
        return row;
      }));

      if (isHost) {
        const select = $("target-player");
        const selected = select.value;
        const candidates = state.players.filter(player => !player.isHost && player.connected);
        select.replaceChildren(...candidates.map(player => new Option(`${player.seat}号 ${player.name}`, player.id)));
        if (candidates.some(player => player.id === selected)) select.value = selected;
        $("send-prompt").disabled = candidates.length === 0;

        const prompt = state.testPrompt;
        if (prompt) {
          const target = state.players.find(player => player.id === prompt.targetPlayerId);
          const labels = { sent: "已发送，等待玩家确认", acknowledged: "玩家已确认，等待提交", submitted: `玩家已提交：${prompt.choice}` };
          $("prompt-status").textContent = `${target?.seat || "?"}号 ${target?.name || "玩家"}：${labels[prompt.status]}`;
        }
      }
    });

    $("send-prompt").addEventListener("click", () => {
      emitWithAck("host:send-test-prompt", { targetPlayerId: $("target-player").value });
    });

    $("vibration-test").addEventListener("click", () => {
      setError(vibrate() ? "" : "当前浏览器不支持震动，请使用 Android Chrome 测试");
    });

    socket.on("player:test-prompt", ({ promptId }) => {
      activePromptId = promptId;
      $("prompt-received").classList.remove("hidden");
      $("prompt-choice").classList.add("hidden");
      $("prompt-overlay").classList.remove("hidden");
      vibrate();
    });

    $("ack-prompt").addEventListener("click", () => {
      emitWithAck("player:ack-test-prompt", { promptId: activePromptId }, () => {
        $("prompt-received").classList.add("hidden");
        $("prompt-choice").classList.remove("hidden");
      });
    });

    document.querySelectorAll("[data-choice]").forEach(button => {
      button.addEventListener("click", () => {
        emitWithAck("player:submit-test-choice", { promptId: activePromptId, choice: button.dataset.choice }, () => {
          $("prompt-overlay").classList.add("hidden");
          activePromptId = "";
        });
      });
    });
  </script>
</body>
</html>
