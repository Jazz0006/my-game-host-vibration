<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>狼人杀助手</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #10131a;
      color: #f4f4f4;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid #343946;
      border-radius: 14px;
      background: #1b202b;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    input,
    button {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #444b5b;
      background: #121721;
      color: white;
    }

    button {
      margin-top: 14px;
      border: 0;
      background: #e3b85a;
      color: #17130a;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #64748b;
      color: white;
    }

    .hidden {
      display: none;
    }

    .room-number {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 5px;
      text-align: center;
      color: #f3c96d;
    }

    .status {
      margin-bottom: 16px;
      text-align: center;
      color: #aab2c2;
    }

    .error {
      min-height: 24px;
      margin-top: 10px;
      color: #ff8585;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #343946;
    }

    .player:last-child {
      border-bottom: 0;
    }

    .seat {
      width: 32px;
      font-weight: 700;
    }

    .player-name {
      flex: 1;
    }

    .online {
      color: #62d995;
    }

    .offline {
      color: #9299a8;
    }
  </style>
</head>

<body>
  <h1>狼人杀助手</h1>

  <div id="connectionStatus" class="status">
    正在连接服务器……
  </div>

  <section id="homeView">
    <div class="card">
      <h2>创建房间</h2>

      <label for="hostName">房主名字</label>
      <input
        id="hostName"
        maxlength="20"
        placeholder="例如：Jazz"
      >

      <button id="createRoomButton">
        创建房间
      </button>
    </div>

    <div class="card">
      <h2>加入房间</h2>

      <label for="roomIdInput">房间号</label>
      <input
        id="roomIdInput"
        inputmode="numeric"
        maxlength="6"
        placeholder="请输入6位房间号"
      >

      <label for="playerName">玩家名字</label>
      <input
        id="playerName"
        maxlength="20"
        placeholder="请输入名字"
      >

      <button id="joinRoomButton" class="secondary">
        加入房间
      </button>

      <div id="errorMessage" class="error"></div>
    </div>
  </section>

  <section id="roomView" class="hidden">
    <div class="card">
      <div>当前房间</div>
      <div id="roomNumber" class="room-number"></div>
    </div>

    <div class="card">
      <h2>玩家列表</h2>
      <div id="playerList"></div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const connectionStatus =
      document.getElementById("connectionStatus");

    const homeView =
      document.getElementById("homeView");

    const roomView =
      document.getElementById("roomView");

    const roomNumber =
      document.getElementById("roomNumber");

    const playerList =
      document.getElementById("playerList");

    const errorMessage =
      document.getElementById("errorMessage");

    let currentRoomId = null;
    let currentPlayerId = null;

    socket.on("connect", () => {
      connectionStatus.textContent = "服务器已连接";
    });

    socket.on("disconnect", () => {
      connectionStatus.textContent = "连接已断开，正在重连……";
    });

    socket.on("room:state", room => {
      if (room.roomId !== currentRoomId) {
        return;
      }

      renderPlayerList(room.players);
    });

    document
      .getElementById("createRoomButton")
      .addEventListener("click", createRoom);

    document
      .getElementById("joinRoomButton")
      .addEventListener("click", joinRoom);

    function createRoom() {
      clearError();

      const name =
        document.getElementById("hostName").value.trim();

      socket.emit(
        "host:create-room",
        { name },
        response => {
          if (!response.ok) {
            showError(response.message);
            return;
          }

          currentRoomId = response.roomId;
          currentPlayerId = response.playerId;

          enterRoom();
        },
      );
    }

    function joinRoom() {
      clearError();

      const roomId =
        document.getElementById("roomIdInput").value.trim();

      const name =
        document.getElementById("playerName").value.trim();

      socket.emit(
        "player:join-room",
        {
          roomId,
          name,
        },
        response => {
          if (!response.ok) {
            showError(response.message);
            return;
          }

          currentRoomId = response.roomId;
          currentPlayerId = response.playerId;

          enterRoom();
        },
      );
    }

    function enterRoom() {
      roomNumber.textContent = currentRoomId;
      homeView.classList.add("hidden");
      roomView.classList.remove("hidden");
    }

    function renderPlayerList(players) {
      playerList.innerHTML = "";

      for (const player of players) {
        const row = document.createElement("div");
        row.className = "player";

        const me =
          player.id === currentPlayerId ? "（我）" : "";

        const host =
          player.isHost ? " 房主" : "";

        row.innerHTML = `
          <div class="seat">${player.seat}号</div>
          <div class="player-name">
            ${escapeHtml(player.name)}${me}${host}
          </div>
          <div class="${player.connected ? "online" : "offline"}">
            ${player.connected ? "在线" : "已断线"}
          </div>
        `;

        playerList.appendChild(row);
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
    }

    function clearError() {
      errorMessage.textContent = "";
    }

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.textContent = value;
      return element.innerHTML;
    }
  </script>
</body>
</html>
